<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Todo App</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="What needs doing?">
      <button id="addBtn">Add</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      <span id="itemsLeft">0 items left</span>
      <div>
        <button class="small-btn" id="clearCompleted">Clear completed</button>
        <button class="small-btn" id="clearAll">Clear all</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
